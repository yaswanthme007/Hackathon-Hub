name: Daily Scrape

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 6am UTC
  workflow_dispatch:        # also lets you trigger manually from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger scraper
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 290 \
            -X POST "${{ secrets.APP_URL }}/api/scrape" \
            -H "Authorization: Bearer ${{ secrets.SCRAPE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Scrape failed with status $HTTP_CODE"
            exit 1
          fi
